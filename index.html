<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Audio Censor Prototype</title>
    <style>
        body {
            background: #141414;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        .player-container {
            border: 4px solid #E50914;
            border-radius: 8px;
            width: 640px;
            height: 360px;
            max-width: 90%;
            margin: 0 auto;
            background: #000;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .controls {
            position: absolute;
            bottom: 10px;
            width: 90%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.6);
            padding: 5px 10px;
            border-radius: 5px;
        }
        button {
            background: #E50914;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 3px;
            cursor: pointer;
            font-weight: bold;
        }
        .subtitle-box {
            position: absolute;
            bottom: 60px;
            font-size: 1.5em;
            background: rgba(0,0,0,0.75);
            padding: 2px 10px;
            border-radius: 4px;
            min-height: 30px;
        }
        .audio-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2em;
        }
        .status {
            margin-top: 20px;
            font-size: 1.2em;
            color: #aaa;
        }
        .alert {
            color: #E50914;
            font-weight: bold;
            animation: flash 1s infinite;
        }
        @keyframes flash {
            0% { opacity: 1; }
            50% { opacity: 0.4; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

    <h1>Smart Audio Filter Simulation</h1>
    <p>Bypassing browser stream restrictions. Press PLAY to simulate the engine logic.</p>

    <div class="player-container">
        <div id="audioIcon" class="audio-indicator">🔊</div>
        <div id="visualizer" style="font-size: 4em;">🎬</div>
        <div id="subtitles" class="subtitle-box"></div>
       
        <div class="controls">
            <button id="playBtn">PLAY</button>
            <div id="timer">00:00</div>
        </div>
    </div>

    <div class="status">System Status: <span id="log">Ready to test...</span></div>

    <script>
        const playBtn = document.getElementById('playBtn');
        const timerDisplay = document.getElementById('timer');
        const subtitleBox = document.getElementById('subtitles');
        const audioIcon = document.getElementById('audioIcon');
        const logDisplay = document.getElementById('log');
        const visualizer = document.getElementById('visualizer');

        let isPlaying = false;
        let currentTime = 0;
        let timerInterval = null;

        // Our blocked words list
        const BLOCKED_WORDS = ["banana", "apple"];

        // The timeline map mirroring your VTT file layout
        const scriptTimeline = [
            { start: 1, end: 4, text: "Welcome to the smart audio filtering test." },
            { start: 5, end: 8, text: "In this sentence, I will say the word banana." },
            { start: 9, end: 12, text: "Now the audio should be completely back to normal." },
            { start: 13, end: 16, text: "Let us try another blocked word like apple." },
            { start: 17, end: 20, text: "Thank you for watching this prototype demonstration!" }
        ];

        playBtn.addEventListener('click', () => {
            if (isPlaying) {
                clearInterval(timerInterval);
                playBtn.textContent = "PLAY";
                logDisplay.textContent = "Paused.";
                isPlaying = false;
            } else {
                playBtn.textContent = "PAUSE";
                logDisplay.textContent = "Monitoring... Audio Clean.";
                isPlaying = true;
               
                timerInterval = setInterval(() => {
                    currentTime++;
                   
                    // Update clock layout
                    let seconds = currentTime < 10 ? "0" + currentTime : currentTime;
                    timerDisplay.textContent = "00:" + seconds;

                    // Match timeline text
                    let currentLine = scriptTimeline.find(line => currentTime >= line.start && currentTime <= line.end);

                    if (currentLine) {
                        subtitleBox.textContent = currentLine.text;
                        let textLower = currentLine.text.toLowerCase();
                       
                        // CENSOR CHECK LOGIC
                        let foundBadWord = BLOCKED_WORDS.some(word => textLower.includes(word));

                        if (foundBadWord) {
                            audioIcon.textContent = "🔇";
                            visualizer.textContent = "🤬";
                            logDisplay.innerHTML = "<span class='alert'>MUTED (Blocked Word Detected)</span>";
                        } else {
                            audioIcon.textContent = "🔊";
                            visualizer.textContent = "🍿";
                            logDisplay.textContent = "Monitoring... Audio Clean.";
                        }
                    } else {
                        subtitleBox.textContent = "";
                        audioIcon.textContent = "🔊";
                        visualizer.textContent = "🎬";
                        logDisplay.textContent = "Monitoring... Audio Clean.";
                    }

                    // Reset loop at end of demo script
                    if (currentTime >= 21) {
                        currentTime = 0;
                    }
                }, 1000);
            }
        });
    </script>
</body>
</html>
